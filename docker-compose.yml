services:
  # ========== MySQL 8.0 ==========
  mysql:
    image: mysql:8.0
    container_name: savory-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
    volumes:
      - savory_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --init-connect=SET NAMES utf8mb4
      - --skip-character-set-client-handshake
    restart: unless-stopped

  # ========== Redis 7.x ==========
  redis:
    image: redis:7-alpine
    container_name: savory-redis
    ports:
      - "6380:6379"
    volumes:
      - savory_redis_data:/data
    restart: unless-stopped

  # ========== MongoDB 7.x ==========
  mongodb:
    image: mongo:7
    container_name: savory-mongodb
    ports:
      - "27017:27017"
    volumes:
      - savory_mongo_data:/data/db
    restart: unless-stopped

  # ========== PostgreSQL 16 + pgvector ==========
  postgres:
    image: pgvector/pgvector:pg16
    container_name: savory-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: savory_ai
    volumes:
      - savory_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ========== RocketMQ NameServer ==========
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.0
    container_name: savory-rmq-namesrv
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    command: sh mqnamesrv
    restart: unless-stopped

  # ========== RocketMQ Broker ==========
  rocketmq-broker:
    image: apache/rocketmq:5.3.0
    container_name: savory-rmq-broker
    depends_on:
      - rocketmq-namesrv
    ports:
      - "10911:10911"
      - "10909:10909"
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
      NAMESRV_ADDR: "rocketmq-namesrv:9876"
    command: sh mqbroker -n rocketmq-namesrv:9876
    restart: unless-stopped

volumes:
  savory_mysql_data:
  savory_redis_data:
  savory_mongo_data:
  savory_pg_data:
